<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Greenwood International School campus">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#e9f6ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc26b"/>
      <stop offset="1" stop-color="#5ba24a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede0"/>
      <stop offset="1" stop-color="#e6d8c3"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="560" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="1000" cy="130" r="60" fill="#fff3c4" opacity="0.9"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="240" cy="120" rx="70" ry="26"/>
    <ellipse cx="300" cy="130" rx="55" ry="22"/>
    <ellipse cx="620" cy="90" rx="80" ry="28"/>
    <ellipse cx="690" cy="100" rx="55" ry="22"/>
  </g>

  <!-- ground -->
  <rect y="540" width="1200" height="260" fill="url(#grass)"/>
  <!-- pathway -->
  <polygon points="520,800 680,800 640,560 560,560" fill="#d9cdb6"/>

  <!-- main building -->
  <g>
    <rect x="360" y="300" width="480" height="260" fill="url(#wall)" stroke="#cbb998" stroke-width="2"/>
    <!-- roof / pediment -->
    <polygon points="340,300 600,190 860,300" fill="#8a5a3c"/>
    <polygon points="360,300 600,205 840,300" fill="#a76b46"/>
    <!-- clock tower -->
    <rect x="560" y="120" width="80" height="120" fill="#efe6d6" stroke="#cbb998" stroke-width="2"/>
    <polygon points="545,120 600,60 655,120" fill="#8a5a3c"/>
    <circle cx="600" cy="165" r="20" fill="#ffffff" stroke="#8a5a3c" stroke-width="3"/>
    <line x1="600" y1="165" x2="600" y2="152" stroke="#8a5a3c" stroke-width="3"/>
    <line x1="600" y1="165" x2="611" y2="165" stroke="#8a5a3c" stroke-width="3"/>
    <!-- columns -->
    <g fill="#ffffff">
      <rect x="410" y="360" width="24" height="200"/>
      <rect x="470" y="360" width="24" height="200"/>
      <rect x="706" y="360" width="24" height="200"/>
      <rect x="766" y="360" width="24" height="200"/>
    </g>
    <!-- entrance -->
    <rect x="560" y="430" width="80" height="130" fill="#6b4a30"/>
    <rect x="572" y="442" width="56" height="118" fill="#8a5a3c"/>
    <!-- windows -->
    <g fill="#9ecbe8" stroke="#ffffff" stroke-width="3">
      <rect x="386" y="340" width="40" height="50"/>
      <rect x="446" y="340" width="40" height="50"/>
      <rect x="714" y="340" width="40" height="50"/>
      <rect x="774" y="340" width="40" height="50"/>
    </g>
  </g>

  <!-- side wings -->
  <rect x="250" y="400" width="120" height="160" fill="#eaddc7" stroke="#cbb998" stroke-width="2"/>
  <rect x="830" y="400" width="120" height="160" fill="#eaddc7" stroke="#cbb998" stroke-width="2"/>

  <!-- trees -->
  <g>
    <rect x="180" y="470" width="16" height="70" fill="#7a5233"/>
    <circle cx="188" cy="455" r="46" fill="#4f9e3e"/>
    <circle cx="150" cy="475" r="34" fill="#5cb04a"/>
    <circle cx="226" cy="475" r="34" fill="#5cb04a"/>
  </g>
  <g>
    <rect x="1000" y="470" width="16" height="70" fill="#7a5233"/>
    <circle cx="1008" cy="455" r="46" fill="#4f9e3e"/>
    <circle cx="970" cy="475" r="34" fill="#5cb04a"/>
    <circle cx="1046" cy="475" r="34" fill="#5cb04a"/>
  </g>

  <!-- flag -->
  <line x1="600" y1="60" x2="600" y2="40" stroke="#5b5b5b" stroke-width="3"/>
  <polygon points="600,42 636,50 600,58" fill="#2f6fb0"/>
</svg>
